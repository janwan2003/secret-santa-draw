<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;width:1200px;height:630px;font-family:ui-rounded,"SF Pro Rounded",system-ui,"Segoe UI",Roboto,sans-serif;background:#fbf6ef;display:flex;overflow:hidden}
.l{flex:1;padding:70px 0 0 80px}
.brand{display:flex;align-items:center;gap:18px;font-size:40px;font-weight:800;color:#1d2621}
.brand img{width:64px;height:64px}
h1{font-size:76px;line-height:1.05;margin:56px 0 24px;color:#1d2621;letter-spacing:-.02em}
p{font-size:34px;color:#5d6862;margin:0}
.r{width:430px;background:linear-gradient(160deg,#c42a3c,#8f1a2a);display:flex;flex-direction:column;justify-content:center;align-items:center;color:#fff;position:relative}
.r:after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.2) 2px,transparent 2.2px);background-size:30px 30px}

</style></head><body><div class="l"><div class="brand"><img src="../public/icon.svg">Hatdraw</div>
